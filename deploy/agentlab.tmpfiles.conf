# /etc/tmpfiles.d/agentlab.conf -- runtime directories recreated at every boot
#  /run/agentlab            daemon socket lives here (socket itself: root:agentlab-users 0660)
#  /run/agentlab/proxy      tokens.json: written by agentlabd, read by the proxy only
d /run/agentlab        0755 root root           -
d /run/agentlab/proxy  0750 root agentlab-proxy -
